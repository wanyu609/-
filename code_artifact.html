<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人記帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        dark: '#1F2937',
                        light: '#F3F4F6'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F9FAFB;
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        /* 列表進場動畫 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> 輕鬆記帳
            </h1>
            <div class="text-sm text-gray-500" id="currentDateDisplay">
                <!-- 顯示今天日期 -->
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-5xl mx-auto w-full p-4 gap-6">
        
        <!-- 左側：輸入表單與總計面板 -->
        <div class="w-full md:w-1/3 flex flex-col gap-6">
            
            <div class="bg-gradient-to-br from-primary to-indigo-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <!-- 裝飾背景 -->
                <div class="absolute -right-6 -top-6 text-white opacity-10 text-8xl">
                    <i class="fa-solid fa-coins"></i>
                </div>
                
                <h2 class="text-indigo-100 text-sm font-medium mb-1 relative z-10" id="totalLabel">當月總花費</h2>
                <div class="text-4xl font-bold tracking-tight relative z-10 flex items-baseline gap-1">
                    <span class="text-2xl">$</span>
                    <span id="totalAmount">0</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-primary"></i> 新增紀錄
                </h2>
                <form id="expenseForm" class="space-y-4">
                    <!-- 日期 -->
                    <div>
                        <label for="dateInput" class="block text-sm font-medium text-gray-700 mb-1">日期</label>
                        <input type="date" id="dateInput" required
                            class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                    
                    <!-- 分類 -->
                    <div>
                        <label for="categoryInput" class="block text-sm font-medium text-gray-700 mb-1">分類</label>
                        <select id="categoryInput" required
                            class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all bg-white">
                            <option value="" disabled selected>請選擇分類</option>
                            <option value="早餐">🍳 早餐</option>
                            <option value="午餐">🍱 午餐</option>
                            <option value="晚餐">🍜 晚餐</option>
                            <option value="零食">🍪 零食</option>
                            <option value="飲料">🧋 飲料</option>
                            <option value="交通">🚌 交通</option>
                            <option value="購物">🛍️ 購物</option>
                            <option value="其他花費">✨ 其他花費</option>
                        </select>
                    </div>

                    <!-- 備註 (選填) -->
                    <div>
                        <label for="noteInput" class="block text-sm font-medium text-gray-700 mb-1">備註 (選填)</label>
                        <input type="text" id="noteInput" placeholder="例如：跟朋友聚餐"
                            class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>

                    <!-- 金額 -->
                    <div>
                        <label for="amountInput" class="block text-sm font-medium text-gray-700 mb-1">金額</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <span class="text-gray-500 font-medium">$</span>
                            </div>
                            <input type="number" id="amountInput" required min="1" placeholder="0"
                                class="w-full pl-8 pr-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                        </div>
                    </div>

                    <!-- 提交按鈕 -->
                    <button type="submit"
                        class="w-full bg-primary hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition-colors shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                        <i class="fa-solid fa-plus"></i> 記一筆
                    </button>
                </form>
            </div>
        </div>

        <div class="w-full md:w-2/3 flex flex-col gap-4">
            
            <!-- 月份過濾器 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2 text-gray-700 font-medium">
                    <i class="fa-regular fa-calendar-days text-secondary"></i>
                    <span>選擇月份：</span>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="month" id="monthFilter" 
                        class="px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all flex-grow">
                    <button id="clearFilterBtn" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl transition-colors text-sm whitespace-nowrap">
                        顯示全部
                    </button>
                </div>
            </div>

            <!-- 花費清單 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex-grow flex flex-col overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h2 class="font-bold text-gray-800">歷史紀錄</h2>
                    <span class="text-xs text-gray-500 bg-gray-200 px-2 py-1 rounded-full" id="recordCount">0 筆</span>
                </div>
                
                <!-- 列表容器 -->
                <div class="p-2 overflow-y-auto max-h-[500px]" id="expenseList">
                    <!-- 紀錄項目會透過 JS 動態產生於此 -->
                </div>
            </div>
            
        </div>
    </main>

    <!-- 訊息提示框 (代替 alert) -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-green-400" id="toastIcon"></i>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        // DOM 元素選取
        const form = document.getElementById('expenseForm');
        const dateInput = document.getElementById('dateInput');
        const categoryInput = document.getElementById('categoryInput');
        const noteInput = document.getElementById('noteInput');
        const amountInput = document.getElementById('amountInput');
        const expenseList = document.getElementById('expenseList');
        const totalAmountEl = document.getElementById('totalAmount');
        const totalLabel = document.getElementById('totalLabel');
        const monthFilter = document.getElementById('monthFilter');
        const clearFilterBtn = document.getElementById('clearFilterBtn');
        const recordCount = document.getElementById('recordCount');
        const currentDateDisplay = document.getElementById('currentDateDisplay');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        // 應用程式狀態 (從 localStorage 讀取或初始化為空陣列)
        let expenses = JSON.parse(localStorage.getItem('myExpensesData')) || [];

        function init() {
            // 設定今天日期
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const formattedDate = `${yyyy}-${mm}-${dd}`;
            
            // 表單預設日期為今天
            dateInput.value = formattedDate;
            
            // 顯示今天日期在 Header
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            currentDateDisplay.textContent = today.toLocaleDateString('zh-TW', options);

            // 過濾器預設為當月
            monthFilter.value = `${yyyy}-${mm}`;

            // 渲染畫面
            render();
        }

        function render() {
            const filterValue = monthFilter.value;
            
            // 過濾資料
            let filteredExpenses = expenses;
            if (filterValue) {
                // filterValue 格式為 YYYY-MM
                filteredExpenses = expenses.filter(expense => expense.date.startsWith(filterValue));
                totalLabel.textContent = `${filterValue.replace('-', '年')}月 總花費`;
            } else {
                totalLabel.textContent = "所有歷史總花費";
            }

            // 根據日期排序 (最新的在最上面)
            filteredExpenses.sort((a, b) => new Date(b.date) - new Date(a.date));

            // 清空列表
            expenseList.innerHTML = '';
            
            // 更新筆數
            recordCount.textContent = `${filteredExpenses.length} 筆`;

            let total = 0;

            // 產生列表項目
            if (filteredExpenses.length === 0) {
                expenseList.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-gray-400">
                        <i class="fa-solid fa-receipt text-5xl mb-4 opacity-30"></i>
                        <p>這個月還沒有任何記帳紀錄喔！</p>
                    </div>
                `;
            } else {
                filteredExpenses.forEach(expense => {
                    total += expense.amount;
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'flex items-center justify-between p-4 mb-2 bg-white hover:bg-gray-50 border border-gray-100 rounded-xl transition-colors fade-in group';
                    
                    // 分類圖示配色邏輯
                    let iconBgColor = 'bg-gray-100 text-gray-600';
                    if(expense.category.includes('餐') || expense.category.includes('早餐')) iconBgColor = 'bg-orange-100 text-orange-600';
                    if(expense.category.includes('零食') || expense.category.includes('飲料')) iconBgColor = 'bg-yellow-100 text-yellow-600';
                    if(expense.category.includes('交通')) iconBgColor = 'bg-blue-100 text-blue-600';
                    if(expense.category.includes('購物')) iconBgColor = 'bg-pink-100 text-pink-600';

                    // 處理分類名稱 (移除 Emoji 以便乾淨顯示)
                    const cleanCategory = expense.category.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim();

                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center text-xl ${iconBgColor}">
                                ${expense.category.split(' ')[0]} <!-- 只取 Emoji 部分 -->
                            </div>
                            <div>
                                <div class="font-bold text-gray-800 flex items-center gap-2">
                                    ${cleanCategory}
                                    ${expense.note ? `<span class="text-xs font-normal text-gray-500 bg-gray-100 px-2 py-0.5 rounded">${expense.note}</span>` : ''}
                                </div>
                                <div class="text-xs text-gray-400 mt-1"><i class="fa-regular fa-clock"></i> ${expense.date}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="font-bold text-lg text-gray-800">
                                $${expense.amount.toLocaleString('en-US')}
                            </div>
                            <button onclick="deleteExpense('${expense.id}')" class="text-gray-300 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50 opacity-0 group-hover:opacity-100 focus:opacity-100" title="刪除此筆">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    expenseList.appendChild(itemDiv);
                });
            }

            // 動態更新總金額數字 (帶有動畫效果)
            animateValue(totalAmountEl, parseInt(totalAmountEl.textContent.replace(/,/g, '')) || 0, total, 500);
        }

        // 處理表單送出
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const date = dateInput.value;
            const category = categoryInput.value;
            const note = noteInput.value.trim();
            const amount = parseInt(amountInput.value);

            if (!date || !category || isNaN(amount) || amount <= 0) {
                showToast('請確認輸入的資料是否正確', 'error');
                return;
            }

            const newExpense = {
                id: Date.now().toString(), // 產生唯一ID
                date,
                category,
                note,
                amount
            };

            // 新增至陣列
            expenses.push(newExpense);
            
            // 儲存至 localStorage
            saveData();
            
            // 若當前有過濾月份，且新增的日期不在該月份，則自動切換過濾器
            if (monthFilter.value && !date.startsWith(monthFilter.value)) {
                monthFilter.value = date.substring(0, 7);
            }

            // 更新畫面
            render();
            
            // 提示成功
            showToast('已成功新增一筆花費！', 'success');
            
            // 清空部分表單，保留日期
            noteInput.value = '';
            amountInput.value = '';
            // categoryInput.value = ''; // 可選擇是否保留上一次分類
        });

        // 刪除紀錄
        window.deleteExpense = function(id) {
            // 這裡不使用 confirm，改為直接刪除搭配 Toast 提示
            expenses = expenses.filter(expense => expense.id !== id);
            saveData();
            render();
            showToast('紀錄已刪除', 'success');
        }

        // 監聽過濾器變更
        monthFilter.addEventListener('change', render);

        // 清除過濾器
        clearFilterBtn.addEventListener('click', () => {
            monthFilter.value = '';
            render();
        });

        // 儲存資料
        function saveData() {
            localStorage.setItem('myExpensesData', JSON.stringify(expenses));
        }

        // 數字跳動動畫
        function animateValue(obj, start, end, duration) {
            if (start === end) {
                obj.innerHTML = end.toLocaleString('en-US');
                return;
            }
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // 緩動函數 (easeOutQuad)
                const easeProgress = progress * (2 - progress);
                const currentVal = Math.floor(easeProgress * (end - start) + start);
                obj.innerHTML = currentVal.toLocaleString('en-US');
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toLocaleString('en-US');
                }
            };
            window.requestAnimationFrame(step);
        }

        // 顯示 Toast 訊息
        let toastTimeout;
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-green-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // 啟動應用程式
        init();
    </script>
</body>
</html>
